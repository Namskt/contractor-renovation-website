<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <!-- Background -->
    <rect width="32" height="32" fill="#09090b"/>

    <!-- Amber accent bar top-left -->
    <rect x="0" y="0" width="32" height="3" fill="#fbbf24"/>

    <!-- BN text -->
    <text
            x="16"
            y="22"
            font-family="Arial Black, sans-serif"
            font-size="13"
            font-weight="900"
            fill="#fbbf24"
            text-anchor="middle"
            letter-spacing="-0.5"
    >BN</text>

    <!-- Corner marks -->
    <polyline points="2,8 2,2 8,2" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.5"/>
    <polyline points="24,30 30,30 30,24" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.5"/>
</svg>